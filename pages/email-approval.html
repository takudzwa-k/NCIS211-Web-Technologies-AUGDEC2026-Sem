<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm an achievement · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="plain-wrap">
    <div class="plain-brand"><div class="mark" id="mark"></div><span>AU Student Achievement &amp; Recommendation Profile</span></div>
    <div id="root"></div>
  </div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById('mark').innerHTML = icon('cap', 22);
  const token = new URLSearchParams(location.search).get('t');
  const root = document.getElementById('root');
  const card = html => { root.innerHTML = '<section class="plain-card">' + html + '</section>'; };
  const problem = (title, text) => card(`<div class="result-bad">${icon('x', 22)} <span>${title}</span></div><p class="lead" style="margin:0">${text}</p>`);

  fetch('/api/approval/' + encodeURIComponent(token || '')).then(r => r.json()).then(j => {
    if (j.state === 'invalid') return problem('This link is not valid', 'It may have been copied incorrectly. Ask the student to send a new request, or contact the Academic Records Office.');
    if (j.state === 'used') return problem('This link can no longer be used', 'It has already been used. Thank you, your answer was recorded.');
    if (j.state === 'handled') return problem('This link can no longer be used', 'The Academic Records Office has already handled this request.');
    if (j.state === 'expired') return problem('This link has expired', 'Links work for 7 days. Ask the student to send a new request.');
    const m = j.mail;
    card(`
      <h1>Please confirm an achievement</h1>
      <p class="lead">Hello ${esc(m.to.replace(/ \(.*\)/, ''))}. ${esc(m.student)} asked the university to record the achievement below, and named you as the person who can confirm it. You do not need an account. This link works once and expires on ${fmtDate(m.expiresISO)}.</p>
      <dl>
        <dt>Student</dt><dd>${esc(m.student)}</dd>
        <dt>Achievement</dt><dd>${esc(m.title)}</dd>
        <dt>Category</dt><dd>${esc(m.category)}</dd>
        <dt>Date</dt><dd>${fmtDate(m.date)}</dd>
        <dt>Description</dt><dd>${esc(m.description)}</dd>
        <dt>Evidence</dt><dd>${m.files.map(f => `<div class="file-line" style="display:flex;align-items:center;gap:8px;margin-bottom:6px">${icon('file', 16)} ${esc(f.name)}
          ${f.id ? '<button class="link" data-view="' + esc(f.id) + '" data-name="' + esc(f.name) + '" style="font-size:13px">View</button>' : ''}</div>`).join('') || 'No file attached'}</dd>
      </dl>
      <div class="fld" style="margin-top:26px"><label for="tier">If you confirm it, how significant was it?</label>
        <select id="tier"><option>Major</option><option selected>Moderate</option><option>Minor</option></select></div>
      <div class="fld"><label for="note">Note <span class="opt-note">(required to decline or ask for more evidence)</span></label>
        <textarea id="note" placeholder="Anything the student or the Records Office should know."></textarea></div>
      <div class="btn-row">
        <button class="btn" id="approve">Confirm achievement</button>
        <button class="btn secondary" id="evidence">Ask for more evidence</button>
        <button class="btn secondary danger" id="reject">I cannot confirm this</button>
      </div>`);
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => previewDoc({ name: b.dataset.name, type: fileExt(b.dataset.name), url: '/api/approval/' + encodeURIComponent(token) + '/file/' + encodeURIComponent(b.dataset.view) }));

    function decide(decision) {
      const note = document.getElementById('note').value.trim();
      if (decision !== 'approve' && !note) return toast(decision === 'reject' ? 'Add a short reason so the student understands.' : 'Say what is missing so the student can add it.');
      fetch('/api/approval/' + encodeURIComponent(token) + '/decision', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ decision: decision, tier: document.getElementById('tier').value, note: note }) })
        .then(r => r.json().catch(() => ({})).then(x => ({ ok: r.ok, x: x })))
        .then(r => {
          if (!r.ok) return toast(r.x.error || 'That did not work.');
          card(`<div class="result-ok">${icon('circleCheck', 22)} <span>Thank you. Your answer has been recorded.</span></div>
            <p class="lead" style="margin:0">${esc(m.student)} and the Academic Records Office have been told. The record shows that <b>${esc(m.to)}</b> answered by email link on ${fmtDate(todayISO())}. You can close this page.</p>`);
        });
    }
    document.getElementById('approve').onclick = () => decide('approve');
    document.getElementById('reject').onclick = () => decide('reject');
    document.getElementById('evidence').onclick = () => decide('evidence');
  }).catch(() => problem('Something went wrong', 'Please try again in a moment.'));
</script>
</body>
</html>
