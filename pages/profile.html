<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="profile">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>My Profile</h1>
          <p>Your verified university record and recent activity.</p>
        </div>
        <button class="btn" id="add-btn"></button>
      </div>

      <section class="card profile-head" id="head-card"></section>
      <section class="stats" id="stats"></section>

      <div class="two-col">
        <section class="card card-pad">
          <div class="card-head">
            <div><h2>Personal information</h2><div class="sub">University record details</div></div>
            <button class="link" id="req-update">Request update</button>
          </div>
          <dl id="info"></dl>
        </section>
        <section class="card card-pad">
          <div class="card-head">
            <div><h2>Recent activity</h2><div class="sub">Latest updates to your record</div></div>
            <a class="link" href="notifications.html">View all</a>
          </div>
          <div id="activity"></div>
        </section>
      </div>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const u = DATA.user, a = DATA.academic;
  document.getElementById('add-btn').innerHTML = icon('plus', 18) + ' Add Achievement';
  document.getElementById('add-btn').onclick = () => toast('The Add Achievement form is the next screen to build.');
  document.getElementById('req-update').onclick = () => openModal({
    title: 'Request an update',
    body: 'Personal details come from university records, so changes are made by the registry. Tell us what needs correcting and an administrator will follow up.',
    actions: [{ label: 'Cancel', secondary: true }, { label: 'Send request', onClick: () => toast('Update request sent.') }]
  });

  document.getElementById('head-card').innerHTML = `
    <div class="avatar lg">${u.initials}</div>
    <div>
      <h2>${u.name} <span class="pill plain">${u.badge}</span></h2>
      <div class="email">${u.email}</div>
      <div class="meta-row">
        <span>${icon('cap', 18)} ${u.programme}</span>
        <span>${icon('user', 18)} Student ID: ${u.studentId}</span>
      </div>
    </div>
    <button class="icon-btn edit" aria-label="Edit profile">${icon('pencil', 18)}</button>`;
  document.querySelector('.profile-head .edit').onclick = () => toast('Editing is limited to contact details in the full system.');

  const verified = DATA.achievements.filter(x => x.status === 'verified');
  const pending = DATA.achievements.filter(x => x.status === 'pending');
  const cats = new Set(verified.map(x => x.category)).size;
  const pendingNote = pending.length ? 'Submitted ' + fmtDate('2025-04-08') : 'Nothing waiting';

  const stat = (tone, ic, label, value, note) => `
    <div class="card stat">
      <div class="stat-top"><div class="stat-icon ${tone}">${icon(ic, 22)}</div><div class="label">${label}</div></div>
      <div class="value ${tone}">${value}</div>
      <div class="note">${note}</div>
    </div>`;

  document.getElementById('stats').innerHTML =
    stat('red',   'cap',         'Cumulative GPA',        a.gpa,            icon('lock', 13) + ' Official, from university records') +
    stat('grey',  'book',        'Credits completed',     a.credits,        'of ' + a.totalCredits + ' programme credits') +
    stat('green', 'circleCheck', 'Verified achievements', verified.length,  'Across ' + cats + ' categories') +
    stat('amber', 'clock',       'Pending review',        pending.length,   pendingNote);

  const rows = [['Student ID', u.studentId], ['Programme', u.programme], ['Faculty', u.faculty],
                ['Year of entry', u.entry], ['Status', u.status], ['Phone', u.phone]];
  document.getElementById('info').innerHTML = rows.map(r =>
    `<div class="info-row"><dt>${r[0]}</dt><dd>${r[1]}</dd></div>`).join('');

  document.getElementById('activity').innerHTML = DATA.activity.map(x => `
    <div class="activity-item">
      <div class="round-icon ${x.tone}">${icon(x.icon, 20)}</div>
      <div><strong>${x.title}</strong><div class="desc">${x.desc}</div><div class="time">${x.time}</div></div>
    </div>`).join('');
</script>
</body>
</html>
