<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drafts · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="drafts">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>Drafts</h1>
          <p>Manage drafts across the AU Student Achievement &amp; Recommendation Profile.</p>
        </div>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  function render() {
    const D = DATA.drafts, box = document.getElementById('list');
    if (!D.length) {
      box.innerHTML = `<section class="card empty-card"><div><div class="big-icon" id="big-icon"></div>
        <p>No drafts need your attention right now.</p><button class="btn secondary" id="refresh">Refresh</button></div></section>`;
      document.getElementById('big-icon').innerHTML = icon('doc', 28);
      document.getElementById('refresh').onclick = () => { render(); toast('Drafts are up to date.'); };
      return;
    }
    box.innerHTML = D.map((d, i) => `
      <div class="card draft-card">
        <div class="round-icon grey">${icon('doc', 22)}</div>
        <div class="who"><strong>${esc(d.type)} letter for ${esc(d.student)}</strong>
          <span>${esc(d.purpose)} · due ${fmtDate(d.deadline)} · saved ${fmtDate(d.updated)}</span></div>
        <button class="btn secondary small danger" data-del="${i}">Delete</button>
        <a class="btn small" href="student-profile.html?id=${encodeURIComponent(d.sid)}&req=${d.reqId}">Continue</a>
      </div>`).join('');
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => openModal({
      title: 'Delete this draft?', body: 'The text you wrote will be removed. The letter request stays open.',
      actions: [{ label: 'Keep draft', secondary: true }, { label: 'Delete draft', onClick: () => { D.splice(+b.dataset.del, 1); saveState(); render(); toast('Draft deleted.'); } }]
    }));
  }
  render();
</script>
</body>
</html>
