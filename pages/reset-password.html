<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="plain-wrap">
    <div class="plain-brand"><div class="mark" id="mark"></div><span>AU Student Achievement &amp; Recommendation Profile</span></div>
    <section class="plain-card" id="card">
      <h1 id="ttl">Choose a new password</h1>
      <p class="lead" id="lead">Pick a password you do not use anywhere else.</p>
      <div class="notice" id="notice" style="display:none;background:var(--red-soft);color:var(--red);border-radius:10px;padding:12px 14px;margin-bottom:16px"></div>
      <form id="form" novalidate>
        <div class="fld"><label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password">
          <div class="meter"><i id="meter"></i></div><div class="meter-text" id="meter-text">At least 10 characters</div></div>
        <div class="fld"><label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"></div>
        <button class="btn" type="submit" id="go">Save password</button>
      </form>
    </section>
  </div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById('mark').innerHTML = icon('cap', 22);
  const q = new URLSearchParams(location.search), token = q.get('token');
  if (q.get('invite')) { document.getElementById('ttl').textContent = 'Welcome to the portal'; document.getElementById('lead').textContent = 'Choose a password to activate your account.'; }
  const say = t => { const n = document.getElementById('notice'); n.textContent = t; n.style.display = t ? 'block' : 'none'; };
  function strength(pw) { let n = 0; if (pw.length >= 10) n++; if (pw.length >= 14) n++; if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) n++; if (/\d/.test(pw)) n++; if (/[^A-Za-z0-9]/.test(pw)) n++; return Math.min(n, 4); }
  document.getElementById('pw').addEventListener('input', e => {
    const pw = e.target.value, n = pw ? strength(pw) : 0, m = document.getElementById('meter');
    m.style.width = (n * 25) + '%'; m.style.background = ['#E5E7EB', '#C8102E', '#B45309', '#15803D', '#15803D'][n];
    document.getElementById('meter-text').textContent = !pw ? 'At least 10 characters' : ['', 'Too weak', 'Getting better', 'Good', 'Strong'][n];
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (pw !== document.getElementById('pw2').value) return say('The two passwords do not match.');
    say('');
    fetch('/api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: pw }) })
      .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j })))
      .then(r => {
        if (!r.ok) return say(r.j.error || 'That did not work. Ask for a new link.');
        document.getElementById('card').innerHTML = `<div class="result-ok">${icon('circleCheck', 22)} <span>Your password has been saved</span></div><p class="lead">You have been signed out everywhere for safety. Sign in with your new password.</p><a class="btn" href="/index.html">Go to sign in</a>`;
      });
  });
</script>
</body>
</html>
