<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Requests · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="letters">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>Letter Requests</h1>
          <p>Request and track formal letters from your lecturers.</p>
        </div>
        <a class="btn" id="new-btn" href="new-request.html"></a>
      </div>

      <section class="card">
        <div class="toolbar">
          <div class="input-icon" id="search-wrap"><input id="q" type="text" placeholder="Search requests..."></div>
          <select class="select" id="f-status">
            <option value="">All statuses</option><option value="sent">Sent</option><option value="accepted">Accepted</option>
            <option value="progress">In progress</option><option value="completed">Completed</option><option value="declined">Declined</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Lecturer / Supervisor</th><th>Letter type</th><th>Deadline</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" style="display:none"><strong>No requests found</strong>Start a new request to ask a lecturer for a letter.</div>
      </section>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const LABEL = { sent: 'Sent', accepted: 'Accepted', progress: 'In progress', completed: 'Completed', declined: 'Declined' };
  const PILL = { sent: 'progress', accepted: 'progress', progress: 'progress', completed: 'completed', declined: 'declined' };
  document.getElementById('new-btn').innerHTML = icon('plus', 18) + ' New request';
  document.getElementById('search-wrap').insertAdjacentHTML('afterbegin', icon('search', 18));

  function render() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const s = document.getElementById('f-status').value;
    const list = DATA.letters.map((l, i) => ({ l, i })).filter(x =>
      (!q || x.l.lecturer.toLowerCase().includes(q) || x.l.type.toLowerCase().includes(q)) && (!s || x.l.status === s));
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    document.getElementById('rows').innerHTML = list.map(x => `
      <tr>
        <td class="strong">${esc(x.l.lecturer)}</td><td>${esc(x.l.type)}${x.l.isPremium ? ' <span class="badge-expedited">Expedited</span>' : ''}</td><td>${fmtDate(x.l.deadline)}</td>
        <td>${pill(PILL[x.l.status], LABEL[x.l.status])}</td>
        <td><button class="icon-btn" data-i="${x.i}" aria-label="Request details">${icon('more', 20)}</button></td>
      </tr>`).join('');
    document.querySelectorAll('[data-i]').forEach(b => b.onclick = () => details(DATA.letters[b.dataset.i]));
  }

  function details(l) {
    const req = DATA.lecturerRequests.find(r => r.letterId === l.id);
    const acts = [{ label: 'Close', secondary: true }];
    if (req && (l.status === 'progress' || l.status === 'completed')) {
      acts.push({ label: 'Ask for a revision', onClick: () => {
        req.revisionAt = todayISO();                                  // the server tells the lecturer
        if (saveState()) toast('Revision request sent to ' + l.lecturer + '.');
      } });
    }
    openModal({
      wide: true, title: 'Request details', actions: acts,
      body: `<dl><dt>Lecturer</dt><dd>${esc(l.lecturer)}</dd><dt>Letter type</dt><dd>${esc(l.type)}</dd>
             <dt>Purpose</dt><dd>${esc(l.purpose)}</dd><dt>Deadline</dt><dd>${fmtDate(l.deadline)}</dd>
             <dt>Status</dt><dd>${pill(PILL[l.status], LABEL[l.status])}</dd>
             ${l.keyPoints ? '<dt>Your key points</dt><dd>' + esc(l.keyPoints) + '</dd>' : ''}
             ${req ? '<dt>Shared</dt><dd>' + req.achievementIds.length + ' achievement(s), until ' + fmtDate(l.deadline) + '</dd>' : ''}</dl>`
    });
  }

  ['q', 'f-status'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render();
</script>
</body>
</html>
