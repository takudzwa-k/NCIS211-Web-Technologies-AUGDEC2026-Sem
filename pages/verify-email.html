<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm your email · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-body">
  <div class="plain-wrap">
    <div class="plain-brand"><div class="mark" id="mark"></div><span>AU Student Achievement &amp; Recommendation Profile</span></div>
    <section class="plain-card" id="card"><h1>Confirming your email…</h1><p class="lead" style="margin:0">One moment.</p></section>
  </div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById('mark').innerHTML = icon('cap', 22);
  const token = new URLSearchParams(location.search).get('token');
  const card = document.getElementById('card');
  fetch('/api/verify-email', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token }) })
    .then(r => r.json().catch(() => ({})).then(j => ({ ok: r.ok, j: j })))
    .then(r => {
      card.innerHTML = r.ok
        ? `<div class="result-ok">${icon('circleCheck', 22)} <span>Your email address is confirmed</span></div><p class="lead">Your account is active. Sign in to continue.</p><a class="btn" href="/index.html">Go to sign in</a>`
        : `<div class="result-bad">${icon('x', 22)} <span>We could not confirm this link</span></div><p class="lead" style="margin:0">${esc((r.j && r.j.error) || 'It may have expired.')} <a class="link" href="/index.html">Back to sign in</a></p>`;
    });
</script>
</body>
</html>
