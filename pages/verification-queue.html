<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verification Queue · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="queue">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>Verification Queue</h1>
          <p>Review evidence and verify student-submitted achievements.</p>
        </div>
      </div>

      <section class="mini-stats" id="stats"></section>

      <section class="card">
        <div class="toolbar">
          <div class="input-icon" id="search-wrap"><input id="q" type="text" placeholder="Search student or achievement..."></div>
          <select class="select" id="f-cat" style="min-width:220px"><option value="">All categories</option></select>
          <select class="select" id="f-status" style="min-width:220px">
            <option value="pending">Pending review</option>
            <option value="evidence">More evidence requested</option>
            <option value="flagged">Flagged, waiting for student</option>
          </select>
          <div class="menu-wrap">
            <button class="btn secondary drop" id="bulk-btn">Bulk actions <span id="bulk-ic"></span></button>
            <div class="menu" id="bulk-menu">
              <button data-bulk="verify">Verify selected</button>
              <button data-bulk="evidence">Request more evidence</button>
            </div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th class="th-cb"><input type="checkbox" class="cb" id="all" aria-label="Select all"></th>
              <th>Student</th><th>Achievement</th><th>Category</th><th>Date submitted</th><th>Evidence</th><th>Status</th><th></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" style="display:none"><strong>Nothing in this list</strong>New submissions will appear here for review.</div>
      </section>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  const Q = DATA.adminQueue, ST = DATA.queueStats, me = DATA.user.name;

  document.getElementById('search-wrap').insertAdjacentHTML('afterbegin', icon('search', 18));
  document.getElementById('bulk-ic').innerHTML = icon('down', 16);
  DATA.categories.forEach(c => document.getElementById('f-cat').add(new Option(c, c)));

  function stats() {
    const card = (ic, num, lbl) => `<div class="card mini-stat">${icon(ic, 36)}<div><div class="num">${num}</div><div class="lbl">${lbl}</div></div></div>`;
    document.getElementById('stats').innerHTML =
      card('clock', 10 + Q.length, 'Awaiting review') +
      card('circleCheck', 28 + ST.verified, 'Verified this week') +
      card('calendar', '1.8 days', 'Average review time');
  }

  function visible() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const c = document.getElementById('f-cat').value, s = document.getElementById('f-status').value;
    return Q.filter(x => x.status === s && (!c || x.category === c) && (!q || (x.student + ' ' + x.title).toLowerCase().includes(q)));
  }

  function render() {
    const list = visible();
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    document.getElementById('all').checked = false;
    document.getElementById('rows').innerHTML = list.map(x => `
      <tr class="clickable" data-id="${x.id}">
        <td class="td-cb"><input type="checkbox" class="cb row-cb" data-id="${x.id}" aria-label="Select ${esc(x.title)}"></td>
        <td><div class="user-cell"><strong>${esc(x.student)}</strong><span>${esc(x.sid)}</span></div></td>
        <td><div class="user-cell"><strong>${esc(x.title)}</strong><span>Sent to: ${esc(x.verifier || 'Academic Records Office')}</span></div></td>
        <td>${esc(x.category)}</td>
        <td>${fmtDate(x.date)}</td>
        <td><span class="file-cell">${icon('file', 18)} ${x.files.length} file${x.files.length > 1 ? 's' : ''}</span></td>
        <td>${x.status === 'pending' ? (x.explanation ? pill('progress', 'Explained') : pill('pending', 'Pending')) : x.status === 'flagged' ? pill('rejected', 'Flagged') : pill('progress', 'More evidence')}</td>
        <td>${icon('right', 18)}</td>
      </tr>`).join('');
    document.querySelectorAll('.row-cb').forEach(cb => cb.onclick = e => e.stopPropagation());
    document.querySelectorAll('#rows tr').forEach(tr => tr.onclick = () => review(Q.find(x => x.id == tr.dataset.id)));
    stats();
  }

  // the student's own record follows what staff decide
  const ach = item => item.achId ? DATA.achievements.find(a => a.id === item.achId) : null;
  const who = item => me + ' · ' + (item.verifier || 'Academic Records Office');
  const closeMail = item => DATA.emails.forEach(e => { if (e.queueId === item.id && e.status === 'open') e.status = 'handled'; });

  function doVerify(item, tier) {
    closeMail(item);
    const a = ach(item);
    if (a) { a.status = 'verified'; a.tier = tier; a.verifiedBy = who(item); a.history.push({ when: todayISO(), text: 'Verified by ' + who(item) + ' (' + tier + ')' }); }
    Q.splice(Q.indexOf(item), 1); ST.closed++; ST.verified++;
    notify(['Student', 'Alumni'], 'check', 'green', 'Achievement verified', item.title + ' has been verified and is now visible on your shared profile.');
    logAudit('Verified', item.title, 'Tier set to ' + tier);
  }
  function doReject(item, note) {
    closeMail(item);
    const a = ach(item);
    if (a) { a.status = 'rejected'; a.reason = note; a.history.push({ when: todayISO(), text: 'Rejected: ' + note }); }
    Q.splice(Q.indexOf(item), 1); ST.closed++;
    notify(['Student', 'Alumni'], 'x', 'red', 'Achievement rejected', item.title + ': ' + note);
    logAudit('Rejected', item.title, note);
  }
  function doEvidence(item, note) {
    const a = ach(item);
    if (a) a.history.push({ when: todayISO(), text: 'More evidence requested: ' + note });
    item.status = 'evidence';
    notify(['Student', 'Alumni'], 'x', 'red', 'More evidence required', item.title + ': ' + note);
    logAudit('Evidence requested', item.title, note);
  }

  function doFlag(item, note) {
    const a = ach();
    function ach() { return item.achId ? DATA.achievements.find(x => x.id === item.achId) : null; }
    if (a) { a.flag = { note: note, by: me, date: todayISO(), reply: null }; a.history.push({ when: todayISO(), text: 'Staff asked for an explanation' }); }
    item.status = 'flagged'; item.flagNote = note; item.explanation = '';
    notify(['Student', 'Alumni'], 'bell', 'red', 'Please explain an achievement', item.title + ': ' + note);
    logAudit('Flagged', item.title, note);
  }

  function review(item) {
    openModal({
      wide: true, title: 'Review achievement',
      body: `
        <dl>
          <dt>Student</dt><dd>${esc(item.student)} · ${esc(item.sid)}</dd>
          <dt>Achievement</dt><dd>${esc(item.title)}</dd>
          <dt>Category</dt><dd>${esc(item.category)}</dd>
          <dt>Sent to</dt><dd>${esc(item.verifier || 'Academic Records Office')}</dd>
          <dt>Submitted</dt><dd>${fmtDate(item.date)}</dd>
          <dt>Evidence</dt><dd>${item.files.map(f => '<div class="file-line">' + icon('file', 16) + esc(f) + '</div>').join('')}</dd>
        </dl>
        ${item.status === 'flagged' ? '<div class="flag-box"><b>Flagged.</b> Waiting for the student to explain: ' + esc(item.flagNote) + '</div>' : ''}
        ${item.explanation ? '<div class="flag-box"><b>Student’s explanation</b><div style="margin-top:6px">' + esc(item.explanation) + '</div></div>' : ''}
        <div class="fld" style="margin-top:20px"><label for="tier">Tier (applies when verifying)</label>
          <select id="tier"><option>Major</option><option selected>Moderate</option><option>Minor</option></select>
          <div class="hint">For reporting only. Lecturers still judge the real achievement.</div></div>
        <div class="fld" style="margin-bottom:0"><label for="note">Note to student (required to reject or ask for more evidence)</label>
          <textarea id="note" placeholder="For example: please add an official certificate."></textarea></div>`,
      actions: [
        { label: 'Cancel', secondary: true },
        { label: 'Request more evidence', secondary: true, onClick: () => {
            const n = document.getElementById('note').value.trim();
            if (!n) { toast('Add a note so the student knows what is missing.'); return false; }
            doEvidence(item, n); saveState(); render(); toast('Evidence requested from ' + item.student + '.'); } },
        { label: 'Flag for explanation', secondary: true, onClick: () => {
            const n = document.getElementById('note').value.trim();
            if (!n) { toast('Say what looks wrong so the student can explain.'); return false; }
            doFlag(item, n); saveState(); render(); toast('Flagged. ' + item.student + ' has been asked to explain.'); } },
        { label: 'Reject', secondary: true, danger: true, onClick: () => {
            const n = document.getElementById('note').value.trim();
            if (!n) { toast('Add a reason before rejecting.'); return false; }
            doReject(item, n); saveState(); render(); toast('Achievement rejected. ' + item.student + ' has been notified.'); } },
        { label: 'Verify', onClick: () => {
            const tier = document.getElementById('tier').value;
            doVerify(item, tier); saveState(); render(); toast('Verified as ' + tier + '. ' + item.student + ' has been notified.'); } }
      ]
    });
  }

  // bulk actions
  const bulkMenu = document.getElementById('bulk-menu');
  document.getElementById('bulk-btn').onclick = e => { e.stopPropagation(); bulkMenu.classList.toggle('open'); };
  document.addEventListener('click', () => bulkMenu.classList.remove('open'));
  document.querySelectorAll('[data-bulk]').forEach(b => b.onclick = () => {
    bulkMenu.classList.remove('open');
    const ids = [...document.querySelectorAll('.row-cb:checked')].map(c => +c.dataset.id);
    if (!ids.length) { toast('Select at least one achievement first.'); return; }
    ids.forEach(id => {
      const item = Q.find(x => x.id === id);
      if (b.dataset.bulk === 'verify') doVerify(item, 'Moderate'); else doEvidence(item, 'Please add more supporting evidence.');
    });
    saveState(); render();
    toast(b.dataset.bulk === 'verify' ? ids.length + ' achievement(s) verified as Moderate.' : 'Evidence requested for ' + ids.length + ' achievement(s).');
  });
  document.getElementById('all').onchange = e => document.querySelectorAll('.row-cb').forEach(c => c.checked = e.target.checked);

  ['q', 'f-cat', 'f-status'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render();
</script>
</body>
</html>
