<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documents · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="documents">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1>Documents</h1>
          <p>Review evidence and transcripts uploaded to your profile.</p>
        </div>
        <button class="btn" id="upload"></button>
      </div>

      <section class="card">
        <div class="toolbar">
          <div class="input-icon" id="search-wrap"><input id="q" type="text" placeholder="Search documents..."></div>
          <select class="select" id="f-type"><option value="">All file types</option><option>PDF</option><option>JPG</option><option>PNG</option></select>
          <select class="select" id="f-status">
            <option value="">All statuses</option><option value="verified">Verified</option>
            <option value="pending">Pending</option><option value="rejected">Rejected</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>File name</th><th>Linked achievement</th><th>Type</th><th>Upload date</th><th>Status</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="empty" id="empty" style="display:none"><strong>No documents found</strong>Upload evidence or a transcript to see it here.</div>
      </section>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  document.getElementById('upload').innerHTML = icon('upload', 18) + ' Upload document';
  document.getElementById('search-wrap').insertAdjacentHTML('afterbegin', icon('search', 18));
  document.getElementById('upload').onclick = () => openUploadDialog({ onDone: render });

  function render() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const t = document.getElementById('f-type').value, s = document.getElementById('f-status').value;
    const list = DATA.documents.map((d, i) => ({ d, i })).filter(x =>
      (!q || x.d.name.toLowerCase().includes(q) || x.d.linked.toLowerCase().includes(q)) && (!t || x.d.type === t) && (!s || x.d.status === s));
    document.getElementById('empty').style.display = list.length ? 'none' : 'block';
    document.getElementById('rows').innerHTML = list.map(x => `
      <tr>
        <td class="strong"><span class="file-cell">${icon('file', 20)} <span>${esc(x.d.name)}${x.d.size ? '<div style="font-size:12px;font-weight:500;color:var(--muted)">' + x.d.size + '</div>' : ''}</span></span></td>
        <td>${esc(x.d.linked)}</td>
        <td>${x.d.type}</td>
        <td>${fmtDate(x.d.date)}</td>
        <td>${pill(x.d.status)}</td>
        <td style="white-space:nowrap">
          <button class="icon-btn" data-view="${x.i}" aria-label="Preview ${esc(x.d.name)}">${icon('eye', 20)}</button>
          <button class="icon-btn" data-dl="${x.i}" aria-label="Download ${esc(x.d.name)}">${icon('download', 20)}</button>
          ${x.d.status === 'pending' ? `<button class="icon-btn" data-del="${x.i}" aria-label="Remove ${esc(x.d.name)}">${icon('trash', 20)}</button>` : ''}
        </td>
      </tr>`).join('');
    document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => previewDoc(DATA.documents[b.dataset.view]));
    document.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => downloadDoc(DATA.documents[b.dataset.dl]));
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const d = DATA.documents[b.dataset.del];
      openModal({
        title: 'Remove this document?',
        body: esc(d.name) + ' has not been reviewed yet. It will be removed from your profile.',
        actions: [{ label: 'Keep it', secondary: true }, { label: 'Remove', danger: true, secondary: true, onClick: () => {
          DATA.documents.splice(DATA.documents.indexOf(d), 1);
          if (d.id) fileStore.del(d.id);
          const a = DATA.achievements.find(x => x.title === d.linked);
          if (a) a.files = a.files.filter(f => f !== d.name);
          logAudit('Deleted', d.name, 'Removed by ' + DATA.user.name);
          saveState(); render(); toast('Document removed.');
        } }]
      });
    });
  }
  ['q', 'f-type', 'f-status'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render();
</script>
</body>
</html>
