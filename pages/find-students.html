<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Students · AU Student Achievement &amp; Recommendation Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="find">
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head">
        <div>
          <h1 id="page-title">Find Students</h1>
          <p id="page-desc">Search profiles shared with you or linked to a letter request.</p>
        </div>
      </div>

      <section class="card search-card">
        <form class="big-search" id="search-form">
          <input id="q" type="text" placeholder="Search by name, student ID or programme" autocomplete="off">
          <button class="btn" type="submit">Search</button>
        </form>
        <p class="search-hint" id="search-hint">Results are limited to students who have granted you access.</p>
      </section>

      <div class="result-count" id="count"></div>
      <div id="results"></div>
    </main>
  </div>
</div>
<div id="toast-root"></div>
<script src="../js/data.js"></script>
<script src="../js/app.js"></script>
<script>
  if (CURRENT_ROLE === 'Supervisor') {
    document.title = 'Attached Students · AU Student Achievement & Recommendation Profile';
    document.getElementById('page-title').textContent = 'Attached Students';
    document.getElementById('page-desc').textContent = 'Review student profiles under your industrial attachment supervision.';
    document.getElementById('search-hint').textContent = 'Results show students who have shared their profile with you for industrial attachment.';
  }
  document.querySelector('.big-search').insertAdjacentHTML('afterbegin', icon('search', 20));

  // the server already filtered this list to what each student lets you see right now
  function accessFor(s) { return { sections: s.access, until: s.until }; }

  function render() {
    const q = document.getElementById('q').value.toLowerCase().trim();
    const list = DATA.sharedStudents.filter(s => accessFor(s) &&
      (!q || (s.name + ' ' + s.id + ' ' + s.programme).toLowerCase().includes(q)));

    document.getElementById('count').textContent = q
      ? list.length + ' matching student' + (list.length === 1 ? '' : 's')
      : list.length + ' student' + (list.length === 1 ? ' has' : 's have') + ' shared their profile with you';

    if (!list.length) {
      document.getElementById('results').innerHTML =
        '<div class="card empty"><strong>No students found</strong>Check the spelling, or ask the student to grant you access.</div>';
      return;
    }
    document.getElementById('results').innerHTML = list.map(s => {
      const ac = accessFor(s);
      return `<div class="card student-card">
        <div class="avatar">${s.initials}</div>
        <div class="who">
          <h3>${esc(s.name)}${s.isPremium ? ' <span class="badge-premium">Premium</span>' : ''}</h3>
          <div class="prog">${esc(s.programme)} · ${esc(s.level)}</div>
          <div class="sid">${s.id}${ac.until ? ' · Access until ' + fmtDate(ac.until) : ''}</div>
        </div>
        <div class="chips">${ac.sections.map(a => '<span class="chip">' + esc(a) + '</span>').join('') || '<span class="chip">Nothing visible</span>'}</div>
        <a class="btn secondary" href="student-profile.html?id=${encodeURIComponent(s.id)}">Open profile ${icon('right', 16)}</a>
      </div>`;
    }).join('');
  }

  document.getElementById('search-form').addEventListener('submit', e => { e.preventDefault(); render(); });
  document.getElementById('q').addEventListener('input', render);
  render();
</script>
</body>
</html>
